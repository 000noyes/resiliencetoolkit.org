cess to​\n       E                                                              ​ arent Child Centers​​and​​food shelves​​can​\n                                                                      P\n       ​appropriate needs​                                            ​support with access to food and other​\n        ​Do individuals have healthcare needs?​                        ​concrete supports​\n                                                                        ​Connect individuals with a​​Community Health​\n         ​Provide emotional support after disasters –​                   ​Worker​​if there are additional physical and​\n          ​partner with counselors, churches, or peer​                    ​mental health needs to connect individuals​\n           ​networks.​                                                     ​with the nearest​​Community Health Center​​or​\n                                                                            ​Free Clinic​\n\n\n\n\n                                                                ​Use the toolkit online at​​resiliencetoolkit.org​         ​29​\n\f​Farm animals and livestock​\n       ​Save the whole family​\n                ​This should go without saying, but animals under care deserve every consideration possible to​\n                 ​be saved during the event of a disaster.​\n        ​Act before - not during!​\n                  ​Livestock can be challenging to corral and move in the best of conditions, never mind during​\n                   ​extremely stressful periods of imminent or occurring disaster. If severe weather is anticipated, it​\n                    ​will never be the incorrect idea to move livestock preemptively. Whether they are moved to​\n                     ​higher ground, indoors, or entirely off-site, do not wait until you & your animals are already​\n                      ​under duress to get them moving.​\n         ​Leave no creature fenced​\n                       ​Sometimes adequate removal of livestock and farm animals from the path of a climate disaster​\n                        ​is​​just not possible​​, especially when human safety is at stake. When movement to safety is not​\n                         ​a possibility, opening all gates and allowing your livestock freedom to roam can go a long way in​\n                          ​ensuring their survival. There are many success stories of farmers opening up pastures before​\n                           ​floods, and returning to find their livestock waiting for them! It is incumbent on you to give them​\n                            ​every chance for survival, even if they do not make their way back to your pastures.​\n\n\n ​Systems​                                                                      ​Stuff​\n\n ​Before Disaster​\n\n           ​ reate a Plan​​[​Another Plan Template​​] (With daily​\n           C                                                                    ​ tockpiling a few days worth of the following​\n                                                                                S\n           ​feed & water requirements for most livestock)​                      ​supplies (in a dry & secure area) will aid in​\n            ​Site Safe Housing for Livestock, ideally high & dry!​               ​buffering against the supply chain failures in​\n             ​Consider Connecting with your local​​FSA & NRCS​                    ​times of disaster​\n              ​Offices​                                                                   ​Feed​\n     ​-​       ​While not essential, your local FSA (Farm Service​                                    ​Dry & non (or less) perishable​\n                ​Agency) and NRCS (Natural Resource​                                                   ​ideal for storage​\n                 ​Conservation Services) agents are valuable​                                           ​Hay, bags of grain, pellets, etc.​\n                  ​resources in times of emergency. Whether applying​                      ​Medications​\n                   ​for disaster insurance, relief programs, or​                            ​Bedding​\n                    ​conservation planning to promote on-farm​                               ​Minerals​\n                     ​resilience, these offices offer a variety of potential​\n                                                                                              ​Water​\n                      ​resources for your farm.​\n                                                                                               ​Fuel​\n                       ​Gather Supplies​\n\n ​During Disaster​\n\n           ​ ct Early & Conservatively​\n           A                                                                              ​Handling Equipment​\n           ​Prioritize Safety​                                                                    ​Halters, leads, corrals, etc.​\n                     ​Checking on/moving livestock in the height​                          ​Temporary Shelter​\n                      ​of disaster can be extremely dangerous.​                                    ​If permanent shelter is in path of​\n                       ​Take every precaution to limit human​                                       ​disaster, establishing and​\n                        ​exposure to peak disaster conditions.​                                      ​preparing a temporary shelter​\n            ​Turn off any electric fence chargers​                                                    ​(shed, copse of trees, retrofitting​\n             ​Leave no animal fenced​\n\n\n                                                                           ​Use the toolkit online at​​resiliencetoolkit.org​             ​30​\n\f                                                                                                ​ basement/garage/greenhouse,​\n                                                                                                a\n                                                                                                ​etc.) may be necessary.​\n                                                                                    ​Trailer​\n                                                                                                ​ ivestock may need to be​\n                                                                                                L\n                                                                                                ​hauled off-site in the event of a​\n                                                                                                 ​disaster. While owning an​\n                                                                                                  ​adequate trailer (or vehicle) may​\n                                                                                                   ​not be accessible/reasonable for​\n                                                                                                    ​all folks, establishing​\n                                                                                                     ​relationships with neighbors who​\n                                                                                                      ​do can be a valuable resource!​\n\n​After Disaster​\n\n        ​Assess & Clean the Site​                                                   ​Debris removal equipment​\n                 ​Debris in pastures/yards can potentially​                                 ​Chainsaws, work gloves, trash​\n                  ​cause harm to returning livestock. Be sure​                               ​bags, eye protection,​\n                   ​to closely inspect pastures for trash, scrap​\n                    ​metal, etc., before reintroducing your​\n                     ​animals.​\n         ​Ensure Fencing Integrity​\n                      ​Before reintroducing livestock walk all​\n                       ​fencelines to catch potential sites of​\n                        ​damage, sag, electricity grounding, etc.​\n          ​Contact your local FSA & NRCS agents​\n                         ​If applicable, local agents will come to your​\n                          ​property to assist in planning for​\n                           ​post-disaster recovery, IDing assistance​\n                            ​programs, filing insurance claims, etc.​\n\n\n\n\n                                                                       ​Use the toolkit online at​​resiliencetoolkit.org​           ​31​\n\f​Developing a Plan​\nI​f you are working with individuals who have Limited English Proficiency (LEP) it is important that you have a​\n ​plan to ensure people are able to communicate, from start to finish. While this plan will heavily depend on the​\n  ​make up of your community, below are some initial steps to help you guide the creation of your plan:​\n\n​Step 1: Identify Individuals with LEP​\n    ​-​ ​Identify what languages are in your community​\n     ​-​ ​Identify demographics of LEP community​\n               ​-​ ​Age​\n                ​-​ ​Families​\n                 ​-​ ​Location​\n      ​-​ ​Identify Trusted Community Members​\n                  ​-​ ​Are there organizations that have relationships with LEP communities?​\n                   ​-​ ​Do schools or clinics have relationships? Individual employers?​\n       ​-​ ​Identify Methods of Contact​\n                    ​-​ ​WhatsApp?​\n                     ​-​ ​On phone calls…​​will you have interpreters available for a call?​\n                      ​-​ ​Facebook?​\n\n​Step 2: Obtain Language Assistance Services​\n    ​-​ ​In person interpretation services​\n     ​-​ ​Phone or video interpretation services​\n      ​-​ ​Google Translate​\n       ​-​ ​Bilingual community volunteers​\n\n​Step 3: Provide Written Translated Materials​\n    ​-​ ​Translate informational material​\n     ​-​ ​Have a set of key phrases translated for disaster scenarios​\n      ​-​ ​Post signage in appropriate language if you are convening individuals​\n       ​-​ ​Provide individuals with a translated list of emergency to-go items​\n        ​-​ ​Help write lists of contacts down for LEP individuals that they can contact in the case of an emergency​\n\n​Step 4: Train Staff/Volunteers on How to Interact with LEP Individuals​\n    ​-​ ​Start with translated material​\n              ​-​ ​There will not always be an interpreter available immediately. In the meantime, how will​\n                     ​staff/volunteers communicate with LEP individuals? Having laminated cards or phrases​\n                      ​remembered can help ease the tension while connecting with interpretation services​\n     ​-​ ​Interpretation Services​\n               ​-​ ​Train staff/volunteers HOW to use interpretation services. If it is a phone service, ensure they​\n                       ​know where to call, what information to provide, etc.​\n                ​-​ ​It is best practice to speak directly to the individual in front of you. A professional interpreter is​\n                        ​trained to speak as if they were you, using “I” statements. Look individuals in the eye. Speak​\n                         ​clearly in short sentences so the interpreter can accurately interpret what you are saying. Allow​\n                          ​time for interpretation. Clarify with an interpreter if you are speaking to the LEP individual OR if​\n                           ​you need to direct a comment towards them if there is confusion.​\n\n​Step 5: Document and Track​\n    ​-​ ​Document which languages appeared, which didn’t​\n     ​-​ ​Document what services were used and how helpful they were. Or were they helpful?​\n\fMake a list of organizations and individuals who can provide support for people in your community with limited English proficiency.\nLanguages spoken in your community by folks with limited English proficiency:\n\n\n\n\nOrganization                       Contact                                 Languages spoken/community connections\n\f​1.9 Community emergency response plans​\n​ older with resources and templates:​ 1.9 Community emergency response plans\nF\n​Before disaster​\n        ​Identify if there are already local documents outlining the emergency response plan for your town and​\n         ​town’s leaders during an emergency:​\n                                               ​Emergency Management Director (EMD): plans for/leads disaster response; develops, updates,​\n                                                ​and implements local emergency management plan (​​LEMPs​​).​\n                                                 ​Fire Department: often first line of disaster rescue, sometimes helps with recovery. May have​\n                                                  ​machinery for vehicle extraction.​\n                                                   ​First Responders/Emergency Medical Services (EMS)​\n                                                    ​Town Clerk/Administrator/Manager, Select Board Members​\n                                                     ​Town Road Crew​\n                                                      ​Mutual Aid and/or Neighbor-to-Neighbor Network leader(s)​\n          ​Create a directory​​of emergency managers, municipal leaders, heads of neighbor-to-neighbor groups,​\n           ​etc. that will be used to coordinate and communicate at the town-wide level.​ ​Places to gather​\n            ​information​​: The​​911 EMS agency​​that covers any given town should have a list of local​\n             ​first-responders.​\n                                                       ​In the event that the ambulance comes from several towns away, there may be local​\n                                                        ​first-responders, including the fire department, who are linked in with the EMS agency​\n                                                         ​responsible for covering your town more immediately.​\n              ​Share this directory with everyone listed in it, or organize an event where everyone can meet one​\n               ​another and strategize/role play around what they do when disaster strikes​\n                ​Create a clear communication system specifically for emergency response​\n                 ​Organize neighborhood pods with block captain/​​phone tree systems​​if there is phone service​\n                  ​Create a directory of neighbors​​with street addresses, landline contacts, etc.​\n                   ​Create a directory of local first responders​​, paid and volunteer​\n                    ​Identify people trained in HAM radio​\n                     ​Identify an evacuation plan and options for sheltering nearby if evacuation is not possible.​\n                      ​Create a plan for volunteers to physically sweep known problem areas - EMS does not monitor these!​\n                       ​Identify a core team of people to do pre-outreach by town or volunteer/supply hub to share​​information​\n                        ​about preparedness​​, and distribute info on available resources and where to direct needs.​\n                         ​If there is none, establish a neighbor-to-neighbor or mutual aid group in your town. Consider partnering​\n                          ​with an existing group that already holds a lot of relationships. EMS and some municipalities often have​\n                           ​lists of vulnerable people. Make sure those folk are known to the neighbor-to-neighbor group.​\n                            ​Identify language access needs and utilize tools like the​​GoogleTranslate​​to support communication​\n                             ​during emergencies. The​​VT Language Justice Project app​​can also be used to share informational​\n                              ​videos in individuals’ language. See​​Section 1.8​​for info on populations with specific needs.​\n ​During disaster​\n                               ​Hold daily meetings w/ key stakeholders (Mutual Aid Orgs, EMS, EMD, selectboard, etc) and create​\n                                ​situation reports​​about actions taken during emergency response​\n                                 ​Hold regular public assemblies at an accessible time/place; share easy to absorb information; distribute​\n                                  ​other things people need (food, water, fuel). Advertise assemblies with posters and by word of mouth. If​\n                                   ​you have access to the internet and phone service, utilize phone trees, Front Porch Forum, social​\n                                    ​media, and local listservs/messaging threads.​\n                                     ​Create hand-outs/digital surveys to capture requests from impacted residents, which integrate into a​\n                                      ​tracker for case management​\n\n                                                                            ​Use the toolkit online at​​resiliencetoolkit.org​              ​32​\n\f          ​ se weather maps at​​waterdata.usgs.gov/vt/nwis/rt​​and the​​River Aware​​app,​​Identify people to look​\n          U\n          ​at the river and watch for ice and debris dams.​\n           ​Receive/submit alerts at​​vem.vermont.gov/vtalert​​and TextMyGov.​\n​Planning for other kinds of climate disaster​\n ​While flooding is VT’s most common climate disaster, consider other potential events in emergency plans:​\n            ​Wildfire smoke​​: prolonged exposure to wildfire smoke can cause respiratory issues and other health​\n             ​problems.​\n                          ​Monitor air quality levels via​​AirNow.gov​\n                           ​Store N95s/KN95s/respirators along with other emergency supplies to protect people from​\n                            ​dangerous air quality (​​1.3​​)​\n                             ​Identify public spaces with air filtration if you do not have air filtration at home like libraries,​\n                              ​schools, health centers (similar to warming and cooling shelters,​​1.5​​).​\n              ​Wet bulb temperatures & High Heat Index​​:​​a hazardous combination of high heat and high humidity.​\n               ​Above around 86ºF plus high humidity can create wet bulb conditions.​\n                               ​Communicate across community networks and public information channels when heat​\n                                ​advisories are in effect (​​1.9​​)​\n                                 ​Remind people about the importance of hydration; create access to drinking water in public​\n                                  ​places on hot days by putting out water coolers and signage (​​1.2​​)​\n                                   ​Especially during the hottest part of the day (11am - 3pm), stay in the shade or in other cool​\n                                    ​locations, including cooling shelters (​​1.5​​).​\n                                     ​Learn the signs of, and communicate about, heat exhaustion (headache, fever, dizziness,​\n                                      ​fainting, shallow breathing, increased thirst, muscle aches, and nausea).​\n                ​Drought​​:​​Unlike other weather-related disasters, drought often comes on slowly in our region.​\n                                       ​Monitor fire danger to protect people, buildings, and ecosystems from preventable fire damage​\n                                        ​during drought conditions:​​fpr.vermont.gov/forest/wildland-fire/monitoring-fire-danger​\n                                         ​Cut back on watering lawns and non-food plants; turn off taps; reduce toilet flushing.​\n                 ​Ice & Wind storms​​can take out power lines, and in turn, heat and cooling.​\n                                          ​At home, store emergency food that does not need electricity to prepare and water on hand​\n                                           ​(​1.2​​), and back-up power/heating (​​1.4​​)​\n                                            ​If staying home is not safe, leave home before travel conditions worsen. Identify local warming​\n                                             ​and cooling shelters (​​1.5​​) ahead of the storm​\n                                              ​Consider back-up communications (radios, walkies, default meetup plans) as electricity, wifi and​\n                                               ​phones may go down (​​1.9​​;​​2.2​​)​\n                  ​Public health emergencies and​​pandemics​\n                                                ​Emergent public health threats can be difficult to plan for, but keeping people healthy can​\n                                                 ​protect communities from the worst impacts of pandemics and other health emergencies. See​\n                                                  ​Section 2.1​​of the toolkit for information on meeting basic needs, including health needs.​\n                                                   ​Creating community emergency response plans (​​1.9​​) beforehand, plans to support populations​\n                                                    ​with specific needs (​​1.8​​), and setting up mutual aid networks (​​1.12​​) can increase community​\n                                                     ​resilience amid public health crises.​\n                                                      ​Stay updated with new information coming from local, state, or federal government sources, as​\n                                                       ​well as public health officials and experts in your community. Hold community gatherings (​​2.3​​) to​\n                                                        ​share information.​\n  ​Also consider planning for disasters that include increased military presence or heightened risk of violence.​\n\n\n\n\n                                                                                   ​Use the toolkit online at​​resiliencetoolkit.org​                    ​33​\n\fNeighbor directory for:\nNAME                      PHONE   EMAIL   ADDRESS\n\f"
