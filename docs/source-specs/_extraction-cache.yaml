    text: "​1.10 Volunteer management​\n​Folder with resources and templates:​       1.10 Volunteer Management\n\n​Recruiting volunteers​\n       ​Post about volunteer opportunities on Front Porch Forum, social media, and in your local paper.​\n        ​See if a local restaurant can provide meals to volunteers.​\n         ​Make lists of organizations and individuals in the community who are willing to volunteer and/or willing​\n          ​to coordinate volunteers during disaster:​\n                  ​Mutual aid and neighbor-to-neighbor networks​\n                   ​Local companies that can offer employee volunteer hours​\n                    ​Faith communities​\n                     ​Schools​\n                      ​Youth organizations​\n                       ​American Legion​\n                        ​Elks Club​\n                         ​Rotary Club​\n                          ​AHS / VDH regional field Directors can be a conduit to local organizations​\n\n​Setting up volunteer shifts​\n        ​SignUp Genius​​is free and helpful for creating volunteer shifts. The paid version allows multiple​\n         ​volunteer coordinators to log in; you can cancel payment as soon as you’re done using it. Download​\n          ​your data regularly to maintain a contact list. You can also use a​​shareable spreadsheet​​on Google or​\n           ​Cryptpad.​\n            ​Create specific time slots and tasks for people to help with.​\n             ​Be clear on what physical abilities people need to be safe and also helpful.​\n              ​Have a diversity of tasks to make space for everyone to engage.​\n                     ​Assess if projects are within your team’s “scope” or ability to help.—the home might be gone, it​\n                      ​may be structurally unsound or dangerous, you may be unable to get permission from a landlord​\n                       ​or homeowner to do work, etc.​\n\n​Potential volunteer tasks for flood recovery​\n        ​Holding down the supply/volunteer dispatch hub​\n         ​Organizing supplies – especially tracking inventory and restocking Work Totes​\n          ​Supply runs – gathering supplies purchasing or donations​\n           ​Survivor outreach through knocking on doors (canvassing) and making phone calls​\n            ​Data management – tracking projects, updating databases and/or volunteer and survivor contacts​\n             ​Volunteer recruitment, training, and outreach​\n              ​Mucking and gutting houses (see section 1.11)​\n               ​Laundry – Expensive safety equipment like rubber-faced work gloves can be reused if washed, and​\n                ​P100 face masks can be reused if the mouthpiece is wiped with a sanitizing wipe​\n                 ​Mental health and child care support for flood survivors​\n                  ​Meal providers/servers​\n                   ​Caretaking for first responders, organizers and community leaders (meals, respite days, transportation,​\n                    ​etc)​\n\n\n\n                                                                 ​Use the toolkit online at​​resiliencetoolkit.org​      ​34​\n\f​Managing volunteers​\n      ​People will want to bring children to the sites to help volunteer. Handle this on a case by case basis and​\n       ​do not send children to locations where there is a concern for bodily safety, such as mold. See​​Youth​\n        ​engagement in flood recovery​​for more information about involving young people in helpful, safe ways.​\n         ​Know what work needs to get done. Use​​Crisis Cleanup​​and track projects in a spreadsheet.​\n          ​Conduct interviews with homeowners to determine scope of work (this can be a volunteer task that​\n           ​precedes other volunteer tasks). Questions for these interviews are pre-loaded in Crisis Cleanup.​\n            ​Create a work sheet for volunteers with info about where they’re going, who they’re meeting, and what​\n             ​they’re doing. This helps coordinate multiple teams at once.​\n              ​For legal/insurance reasons, have flood volunteers​​sign a waiver​​regardless of the scope of their work.​\n               ​Link to your agreement wherever volunteers are signing up for shifts and have people sign agreements​\n                ​before starting work.​\n                 ​Tell volunteers what to bring to do the work (sunscreen, water, snacks, durable footwear, etc.)​\n                  ​Train volunteers in the tasks assigned each shift and include the importance of taking breaks and​\n                   ​hydrating.​\n                    ​Organize volunteers into work crews of 3-6 people, ideally large enough so people can take breaks and​\n                     ​not work for more than 5 hours. Coordinating work is challenging and situations shift but the more​\n                      ​organized you can be, the more likely you’ll be to retain volunteers.​\n                       ​Count volunteer hours, even if a rough estimate. This can be tracked through collecting work sheets​\n                        ​from volunteer crews or through SignUp Genius. Municipalities will apply for grants that require​\n                         ​volunteer hours as part of the application. Rough estimates are okay!​\n                          ​Feed volunteers! Think about how else you can thank and appreciate them.​\n\n\n\n\n                                                                 ​Use the toolkit online at​​resiliencetoolkit.org​     ​35​\n\f"
