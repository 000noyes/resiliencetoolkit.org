heavy equipment they have, and what​\n           ​might be available for community disaster​            ​Front-End Loader​\n            ​response use.​                                        ​Backhoe Loader (Front end attachments w/​\n                                                                    ​excavator arm at rear)​\n                                                                     ​Skid Steer Loader / Bobcat​\n                                                                      ​Track​\n\n\n\n\n                                                              ​Use the toolkit online at​​resiliencetoolkit.org​     ​24​\n\f"
