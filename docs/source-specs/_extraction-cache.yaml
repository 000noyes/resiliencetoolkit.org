    text: "​2.3 Community Building​\n​ older with resources and templates:​ 2.3 Community building\nF\n​Many of the activities in the Emergency Response and Preparedness section get people talking to their​\n ​neighbors, creating systems of connectedness, and building the relationships that undergird resilience. Here​\n  ​are some additional ways to build community.​\n\n​ ocal and regional governance and coordination​\nL\n​Practicing and developing coordination and connection between local groups, towns/municipalities, regional​\n ​and county resources strengthens communities. Coordination helps prepare for emergency response by​\n  ​creating clear lines of communication and expectations.​\n\n​On a regional scale, identify people and groups to cultivate relationships with and connect to one another:​\n        ​Community institutions (libraries, schools, universities) that have infrastructure, staffing and systems for​\n         ​community use, working to get those institutions to agree to share those resources and systems with​\n          ​the community in general, minimally during emergencies.​\n           ​Community institutions, municipal staff and volunteers, organizations holding the work of emergency​\n            ​response​\n             ​Regional and county resources, like​​Regional Planning Commissions​​, community development​\n              ​agencies, and​​natural resource conservation districts​\n               ​Mutual aid groups and neighborhood groups that do work on an ongoing basis, not just in response to​\n                ​emergencies​\n\n​Some strategies and ideas on building these connections:​\n       ​Connect Resilience Hubs and Mutual Aid groups across multiple neighboring towns​\n        ​Host shared events between identified groups​\n         ​Share resources like tools/supplies​\n          ​Strengthen regional governance through events and celebrations​\n\nI​nstitutional allies​\n ​People associated with institutions—town/municipal leaders, schools, colleges, nonprofits, and​\n  ​foundations—can and should be invested in healthy, resilient communities.​\n          ​Build relationships with institutional allies​\n           ​Identify roles for different types of entities and how they could interface with mutual aid efforts​\n            ​Create a directory​​of these contacts​\n\n​Business directory​\n       ​Connect with local businesses to learn about what services they offer, and how they can help people in​\n        ​your community.​​Create a directory​​of this information.​\n         ​Develop a list of opportunities for private commercial support (storage, heavy equipment, freezer/fridge​\n          ​space, food production, etc.)​\n\n​Tradesfolk directory​\n       ​Create a directory​​of trusted local (or almost local) contractors, electricians, plumbers, land movers,​\n        ​haulers, structural engineers, etc. that could be called any day or during disasters.​\n         ​To help create this tool, put an ask out on Front Porch Forum in your community.​\n          ​Consider hiring folks for on-going projects to support their business in good times and in disaster.​\n\n\n\n                                                                 ​Use the toolkit online at​​resiliencetoolkit.org​   ​43​\n\f​ ommunity spokespeople​\nC\n​A community’s stories are always better told by the people living them.​\n       ​Create a directory​​of local people trained and willing to speak about their experience with disaster or​\n        ​otherwise with media, elected officials, funders, etc. Representing community needs accurately has​\n         ​real, positive impacts on material conditions.​\n          ​Develop a media list​​of local reporters and outlets, and keep it updated. Reach out to reporters to build​\n           ​relationships and establish local spokespeople as trusted sources.​\n            ​Hold practice sessions for people to share and hone their stories about disaster​\n                    ​Resources for giving effective testimony:​​Rural VT Activist Toolkit​​and​ ​Vermont League of Cities​\n                     ​and Towns​\n\n​ e-escalators and conflict facilitators​\nD\n​In crises, it’s important to have folks who are trained to de-escalate conflict and spread the calm.​\n         ​Hold skills training to teach people broadly​​how to intervene in escalating situations​​.​\n          ​Reach out to local mutual aid organizations and ask about setting up de-escalation and/or conflict​\n           ​transformation workshops.​\n            ​Consider creating a team of local people who can attend events where escalated conflict might occur.​\n             ​Hold recurring gatherings for people to come discuss ongoing conflict, support each other, and​​practice​\n              ​conflict management and transformation​​.​\n               ​Consider creating a team of local people who can mediate interpersonal or community conflict.​\n\n​Third spaces​\n        ​Create a directory of businesses,​​libraries​​, community centers, public commons, health clinics,​​grange​\n         ​halls​​that can host community events, meetings and gatherings. These third spaces can help hold​\n          ​on-going efforts to build resilience and be prepared to offer space for supplies or disaster response​\n           ​coordination.​\n            ​If your community does not have a place to gather, host meals, or hold events, consider working​\n             ​together to create that place or use existing spaces for community building activities to develop an​\n              ​unexpected third space together.​\n\n​ kill building workshops​\nS\n​Skill building is a great way to practice working together, learning new things and equipping our community to​\n ​handle difficult experiences from disaster to grief. Some skill-shares may be certifications that 1-2 people gain​\n  ​and can share informally with other group members, while some may be less formal workshops.​\n         ​Gather a list of skills people in your group are interested in learning.​\n          ​Identity group members who have skills they can teach and reach out to community members who​\n           ​have these skills.​\n            ​Create a rotating series of skill-building workshops that people can sign up for free or low-cost.​\n\n​Potential skills to build (links are to sample training materials)​\n\n\n ​Flood and disaster response​                                ​Recovery and Coordination​\n        ​Flood Preparation​                                         ​Safe Gut & Mucking - cleaning out​\n         ​General First Aid and Basic Life Support​                  ​households.​​Examples from Mutual Aid​\n          ​Basic Rescue​                                              ​Disaster Relief​\n                                                                       ​Safe Food Prep​\n\n\n                                                                ​Use the toolkit online at​​resiliencetoolkit.org​    ​44​\n\f           ​ ilderness First Aid and Wilderness First​\n           W                                                                ​ apping - local resources and updating road​\n                                                                            M\n           ​Responder​                                                      ​hazards​\n                       ​Train NEK​                                                       ​Using tools like​​Open Street Maps​\n                        ​NOLS courses​                                       ​FEMA, state and insurance form completion -​\n            ​Stop the bleed​                                                  ​a Long-term Recovery Group in your area​\n             ​Narcan​                                                          ​might be able to provide this​\n              ​Mental health first aid​                                         ​Volunteer coordination​\n                         ​Radical Mental Health First Aide​                      ​Mutual aid spreadsheet management​\n                          ​(RMHFA) Action Plan​​: “A non-linear,​                 ​Meeting and Process Facilitation​\n                           ​intuitive step-by-step action plan​​to​\n                            ​use when providing support in mental​\n                             ​health crisis situations.”​\n               ​Herbal First Aid training​\n\n ​Other​                                                                    ​ ardening​\n                                                                            G\n           ​ anning and food preservation​\n           C                                                                ​Media relations​\n           ​Chainsaw skills​                                                 ​Conflict de-escalation​\n            ​Welding​                                                         ​Conflict management​\n             ​Herbal remedies​                                                 ​Grief circles​\n\n\n​ un activities that build community​\nF\n​Gather regularly to be joyful and have fun with your community. This is how we build the relationships that are​\n ​the foundation for communication, mutual aid and rapid response in times of crisis. Many local institutions like​\n  ​schools, libraries and business may already be primed to host these events, but usually they need people to​\n   ​make it happen.​\n\n​ s a practice of baseline resilience, host regular community meetings on a recurring day of the month (e.g.​\nA\n​third Thursdays) in a consistent location. Provide food if you are able, or make it a potluck. If you are hosting a​\n ​public assembly in which decisions are getting made about local governance, check out​​how to host a public​\n  ​assembly​​, pages 11, 18-25. Ideas for fun community building activities:​\n          ​Town dances​\n           ​Music jams or karaoke​\n            ​Community yoga​\n             ​Bingo nights​\n              ​Community meals​\n               ​Public art creation and craft nights​\n                ​Community talent shows​\n                 ​Spelling bees​\n\n​ ook to local organizations like the​​Civic Standard​​,​​NEK Organizing​​, and​​Hartland Community Breakfasts​​for​\nL\n​more inspiration.​\n\n\n\n\n                                                                      ​Use the toolkit online at​​resiliencetoolkit.org​   ​45​\n\f"
