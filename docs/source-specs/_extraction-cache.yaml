    text: "​Organizing your community: who is here and what are they doing?​\n​ older with resources here:​ 0. Organizing your community\nF\n​The first step of organizing your community is thinking about who is in in it, and the place where you live. You​\n ​can do this activity alone, but best to do it with a few other people—friends, colleagues, neighbors.​\n\n​Mapping your community​\n ​ rite down three important things about your​\n W                                                         ​1:​\n ​place/what life is like here.​\n\n                                                           ​2:​\n\n\n                                                           ​3:​\n\n\n\n ​What are the biggest challenges in your place?​\n\n\n\n\n ​What are the biggest assets in your place?​\n\n\n\n\n ​ escribe thriving conditions for your place. Use your​\n D\n ​imagination!​\n\n\n\n\n​Who is in your community/place?​\n ​Role​                                                    ​Name(s)​\n\n ​ ong Term Recovery Group (LTRG)​​(groups​\n L\n ​established to support individuals after flooding)​\n\n ​Fire chief​\n\n ​Road crew​\n\n ​Emergency Management Director​\n\n ​Town clerk​\n\n ​Selectboard members​\n\n ​Mutual aid/neighbor to neighbor network leaders​\n\n\n\n                                                              ​Use the toolkit online at​​resiliencetoolkit.org​   ​10​\n\f ​Leaders/vocal people in your community​\n\n ​School principal​\n\n ​General store owner​\n\n ​State Senator*​\n\n ​State Representative(s)*​\n​*Find your legislators at​​legislature.vermont.gov/people/​​.​\n\n​What other dynamics are present in your place?​\n ​Who do people listen to?​\n\n ​Which voices are loudest?​\n\n\n ​Who is always showing up to help?​\n\n\n ​Who has been in your place the longest?​\n\n\n ​Who is the newest in your place?​\n\n\n ​Who is struggling the most?​\n\n\n\n ​ ho is benefiting from how your place is right​\n W\n ​now?​\n\n\n\n\n ​ ho in your community might have different​\n W\n ​needs than most other people? What are those​\n  ​needs?​\n\n\n\n\n​Stuff and systems in your community​\n ​ hat emergency supplies are stored in your​\n W\n ​place, and where?​\n\n\n\n\n                                                                  ​Use the toolkit online at​​resiliencetoolkit.org​   ​11​\n\f ​ hat infrastructure is important to your place?​\n W\n ​Is it maintained?​\n\n\n\n ​ re there places to gather? What places do​\n A\n ​people go to most often?​\n\n\n\n ​ hich systems in your place work well? Which​\n W\n ​work poorly?​\n\n\n\n ​ hat/who are the active community groups,​\n W\n ​organizations, and town committees?​\n\n\n\n ​ ow do people receive and share information​\n H\n ​(local news, social media, gathering places)?​\n\n\n\n ​ hat essential services are available, and​\n W\n ​which are missing?​\n\n\n\n\n​Knowing your ecosystem​\n​ heck out the ANR atlas:​​https://anrmaps.vermont.gov/websites/anra5/​​for information on the hydrogeology,​\nC\n​flood risk, and more in your Vermont community. Click on ‘Layers’ on the bottom left of the window, and turn on​\n ​these layers by checking the boxes next to them:​\n     ​●​ ​FEMA flood layers​​show where the edges of floods have gone​\n      ​●​ ​Soil hydrologic groups​​show soil types, and help you imagine which locations will remain wet after​\n            ​flooding, because different types of soil drain more quickly than others.​\n       ​●​ ​Wetland delineations​​show where the land is always also water​\n\n\n ​What rivers and streams run through your place?​\n\n\n\n ​Where does it get wet first?​\n\n\n ​ hat else do you know about the ecosystem in your​\n W\n ​place?​\n\n\n\n                                                           ​Use the toolkit online at​​resiliencetoolkit.org​   ​12​\n\f​Bringing people together​\n​ ou can spend any amount of time organizing your community and building resilience. It will probably take 5-10​\nY\n​hours of conversations to get a group of about 10 people ready to organize with you. Meeting once a week can​\n ​help build momentum, but you can also meet every other week or once a month.​\n  ​Here are some things to consider when starting to organize your community:​\n      ​●​ ​What work is already happening to build resilience?​\n       ​●​ ​Of the people you mapped, how many do you know? Where can you go to know them better or​\n               ​introduce yourself? Who is missing?​\n        ​●​ ​Why are you excited about building resilience? Can you get comfortable talking about why you care​\n                ​about this to people you don’t know well (yet)?​\n         ​●​ ​What problems are most discussed, or most important, to people in the place where you live? How can​\n                 ​building resilience help address some of these problems?​\n          ​●​ ​Where can you start talking about building community resilience, and meet people who are interested in​\n                  ​working on this with you?​\n\n​Once you have a few people - it can just be four or ten people! - you can meet. You’ll need:​\n       ​A place to meet - preferably somewhere centrally located, comfortable, and accessible​\n        ​Food and/or beverages - maybe a local restaurant can donate a meal, or you can have people bring​\n         ​things potluck-style​\n          ​A way to take notes​\n           ​Printed copies of the toolkit: download pdfs online at​​resiliencetoolkit.org/downloads​​.​\n            ​An agenda​\n                      ​Introduce yourself and share about why you feel it is important to build resilience to climate​\n                       ​disaster and other disruptions in your community.​\n                        ​Invite everyone else to introduce themselves.​\n                         ​Talk about what you heard as a group: where are there shared priorities and interests? What​\n                          ​kind of work are the people in this room interested in doing?​\n                           ​Share printed copies of the toolkit. Invite people to read the introduction and look through the​\n                            ​sections. If you like, have people take turns reading parts of the introduction aloud.​\n             ​Do one or more of the activities in the toolkit:​\n                             ​Organizing your community activities (pages 9-11)​\n                              ​Get to know the toolkit interactive activity (facilitation guide below)​\n              ​Reconvene and discuss one or more of these questions:​\n                               ​Who is doing related work already in your community? Are they in this conversation?​\n                                ​Who is missing from this group? Are they people you know, or need to meet for the first time?​\n                                 ​Is there more information you need before continuing your organizing? How can you get it?​\n               ​Determine if the group is interested in meeting again, and set a meeting time.​\n                                  ​Make a plan for who will find the space to meet, if someone is able to bring food, who will invite​\n                                   ​the new people you’ve identified to your group, and any other planning.​\n                                    ​Consider posting about your next meeting publicly on local social media, and/or putting up flyers​\n                                     ​at the grocery store or school.​\n                                               ​It makes sense to start with a small group of people, but the more buy-in you have in​\n                                                ​your community about this project, the more possible it will be.​\n                                      ​Plan to conduct the community needs assessment activity (facilitation guide below) at your next​\n                                       ​meeting!​\n\n\n                                                                       ​Use the toolkit online at​​resiliencetoolkit.org​          ​13​\n\f​Facilitation guides​\n​ et to know the toolkit: interactive activity​​45 minutes to 1 hour​\nG\n​This activity will help orient you to some of the sections of the toolkit, and practice using it to solve problems​\n ​about resilience.​\n\n   ​1.​ ​Print out the interactive toolkit activity​​page of prompts​​, or edit the prompts to best fit the non-flooding​\n             ​disaster you want people to think about. Cut the prompts up along the dotted line.​\n    ​2.​ ​Set the scene: talk about a scenario, either a real one that has happened in your community or an​\n              ​imagined one, that would benefit from increased community resilience. Warn people that it might be a​\n               ​bit stressful to think about these situations, but that planning and working together make them less​\n                ​scary when they’re happening. Some ideas:​\n                        ​a.​ ​Heavy rains drench your town, and the river rises more than it has in the past. Homes along the​\n                                ​river are damaged, and many are flooded. Town water is compromised.​\n                         ​b.​ ​An ice storm comes through and takes out power, cell service, internet.​\n                          ​c.​ ​Imagine something else realistic!​\n     ​3.​ ​Split your group into smaller groups of 2-5 people each, and give each group a prompt. As you’ll see,​\n                 ​some questions are about before the disaster; others are about the disaster itself; and the rest are​\n                  ​about aftermath. You can also read all the prompts aloud, and if people want to reorganize themselves​\n                   ​to work with prompts that interest them more, they can do so.​\n      ​4.​ ​Instruct groups to spend about 20 minutes discussing the prompt and using the toolkit to respond to it.​\n       ​5.​ ​Reconvene as a group and hear from people about what they learned, what questions this activity​\n                    ​brought up, and what they found useful in the toolkit.​\n\n​ onduct a Community Needs Assessment​\nC\n​Every community is different! Use this activity to help identify some of your community’s strengths and priorities​\n ​for further resilience work. It can be helpful to do this activity after going through the Mapping Your Community​\n  ​exercises that begins on page 9.​\n\n​ ou can do this activity in a meeting of people interested in building community resilience, or drop off copies of​\nY\n​the assessment at local schools, the town office, and the library—or in another setting!​\n\n   ​ .​ ​Print out copies of the​​Community Needs Assessment​​for everyone in your group.​\n   1\n   ​2.​ ​Give people 15-20 minutes to complete the assessment.​\n    ​3.​ ​Break into small groups or pairs to discuss the results once people are finished, then share as a whole​\n             ​group.​\n     ​4.​ ​Make some notes about which questions, issues, and opportunities came up over and over again.​\n                     ​a.​ ​Was there consensus on a priority issue, or areas in which more information is needed?​\n                      ​b.​ ​Is there someone who holds relevant information who wasn’t in the room?​\n      ​5.​ ​Make a plan to connect with people who can help with the ‘three big things’ or ‘three easy things’ you​\n              ​identified in the assessment.​\n       ​6.​ ​Make a plan to share results of the assessment with people who were not present. Consider posting on​\n               ​local social media, putting up flyers at schools, grocery stores, clinics, town offices. The more people​\n                ​you engage in this process, the better your work will reflect the diverse needs and skills of your​\n                 ​community.​\n\n\n\n\n                                                                  ​Use the toolkit online at​​resiliencetoolkit.org​       ​14​\n\f​We started organizing. How do we know it’s working, and when to ask for more help?​\n​It can be hard to tell if you’re making progress. Here are some signs your work is effective:​\n         ​More than four people attended your first meeting​\n          ​Someone you haven’t explicitly invited to participate heard about your work, and is excited to participate​\n           ​in the future​\n            ​You received an email or a call from a town official asking what you’re working on​\n             ​You and one, two, or more people are energized and excited to keep working with this toolkit and​\n              ​talking to people in your community about it.​\n\n​ ere are some signs you might be ready to ask for more help and move ahead with plans to launch a​\nH\n​resilience hub.​\n         ​Have you met two or more times?​\n          ​Do you have a group of 2-5 people excited about launching a resilience hub?​\n           ​Have you talked to 10+ neighbors to see if they think this is a good idea?​\n            ​Have you used the community needs assessment (above) and begun to identify what your priorities are​\n             ​as a community?​\n              ​Can you identify three sections of the toolkit where you would like support?​\n\n​Here are some different kinds of assistance to seek out:​\n    ​●​ ​Fiscal sponsorship: access to nonprofit status so you can raise funds and pay stipends without creating​\n             ​a new organization​\n     ​●​ ​Fundraising to support your work​\n      ​●​ ​Technical assistance using the toolkit​\n                  ​○​ ​Help facilitating group meetings​\n                   ​○​ ​Visioning for how to best use the toolkit in your community​\n                    ​○​ ​Subject matter expertise on sections you want to work on​\n       ​●​ ​Relationships with existing institutions like libraries and schools, places of worship, food pantries,​\n              ​community spaces to see if they are interested in participating in your work to launch a resilience hub.​\n        ​●​ ​Connection with elected officials or local committees to advocate for and share about your work​\n\n​ hink about if you can get this kind of help in your community, from people you already know. If not,​​reach out​\nT\n​to Community Resilience Organizations (CROs)​​—​resiliencetoolkit@gocros.org​​—and we’ll do our best to​\n ​connect you with people and organizations who can assist.​\n\n\n\n\n                                                               ​Use the toolkit online at​​resiliencetoolkit.org​   ​15​\n\f​Going deeper: finding the community work​​you​​want to do​\n​ here are so many ways to support community resilience, and each person has a unique set of skills and​\nT\n​interests to contribute. It can feel and be isolating to find yourself in a moment of disaster, not knowing who to​\n ​turn to or how to help. The activities below can guide some of your personal preparedness for difficult times.​\n  ​Respond to the reflection questions below to spur your thinking.​​Check out this zine for more ideas​​.​\n ​ hat special skills do you have?​\n W\n ​What skills would you like to learn?​\n\n\n\n\n ​ hat activities/work do you find​\n W\n ​rewarding? Think about things you do​\n  ​that other people find difficult, but that you​\n   ​enjoy.​\n\n\n ​ o you enjoy collaborating with people or​\n D\n ​working on projects alone?​\n\n\n ​ o you like to spend time inside/outside?​\n D\n ​Working through a list of tasks, or​\n  ​imagining a new project? Do you enjoy​\n   ​words, numbers, visual art, or another​\n    ​medium?​\n\n ​ hat problems are you most excited​\n W\n ​about solving?​\n\n\n ​ ho in your community inspires you?​\n W\n ​What do you find inspiring about them?​\n\n\n\n\n​ ook at this (incomplete!) list of roles to play in a community, and check out the corresponding toolkit sections​\nL\n​to see if any of this work appeals to you.​​Check out this list​​for more ideas.​\n​Roles in a community​                                           ​Toolkit section​\n​Working with children​                                          ​1.8​\n​Helping people with health and wellbeing​                       ​1.3, 1.7, 2.1​\n​Maintaining infrastructure (roads, buildings, water systems)​ ​1.4, 1.5, 1.9, 1.11, 2.2, 2.3​\n​Managing finances and administration​                           ​1.10, 1.13, 2.3​\n​ ediating conflict and facilitating decision-making;​\nM\n​Connecting people with each other and information;​\n ​managing people and projects​                                  ​Knowing your community, 1.9, 1.10, 1.12, 2.3​\n​Growing food/medicine, Preparing meals​                         ​1.2, 1.5, 1.8, 1.10, 1.12, 2.1, 2.3​\n\n\n\n                                                               ​Use the toolkit online at​​resiliencetoolkit.org​   ​16​\n\f​ uilding culture through art, spirituality, group activities;​\nB\n​creating plans and visions for your community​                     ​1.9, 1.12, 2.3​\n​ pecialized technical skills (construction, fixing machinery,​\nS\n​plumbing, electrical work)​                                    ​1.6, 1.9, 1.11, 2.2, 2.3​\n​ roviding individual help to people (picking up groceries,​\nP\n​offering rides, 1:1 emotional support)​                            ​1.5, 1.6, 1.7, 1.8, 1.12, 2.1​\n​Stewarding ecosystems (river corridors, tree maintenance)​ ​Knowing your community, 1.9, 2.1, 2.3​\n​Teaching skills/leading workshops​                                 ​Knowing your community, 1.10, 1.11, 2.2, 2.3​\n​Organizing events​                                                 ​Knowing your community, 1.10, 2.1, 2.3​\n\n​Pod mapping​\n​ his activity, developed by the​​Bay Area Transformative Justice Center​​, can help identify your “pod” -​​who​​you​\nT\n​can count on for support and connection in the everyday and during disaster. Interpersonal relationships help​\n ​us move through stress or adrenaline; loved ones help us make sure we are taking care of ourselves, even​\n  ​while showing up to help others.​\n\n​ se the diagram on the next page to do this activity. To start, write your name in the middle grey circle. The​\nU\n​surrounding bold-outlined circles are your pod. Write the names of the people who are in your pod. We​\n ​encourage people to write the names of actual individuals, instead of things such as “my church group” or “my​\n  ​neighbors.”​\n\n​ he dotted lines surrounding your pod are people who are “movable.” They are people that could be moved​\nT\n​into your pod, but need a little more work. For example, you might need to build stronger relationships or trust​\n ​with them.​\n\n​ he largest circles are community resources. For example: a local food shelf or sexual violence prevention org​\nT\n​or a park with your favorite tree that you like to go sit with to take some deep breaths. Or really anyone or​\n ​anything else you think of as a resource.​\n\n\n\n\n                                                                  ​Use the toolkit online at​​resiliencetoolkit.org​   ​17​\n\f​Use the toolkit online at​​resiliencetoolkit.org​   ​18​\n\f                          Pods and Pod Mapping Worksheet\n\n                        Written by Mia Mingus for the BATJC, June 2016\n\n\nDuring the spring of 2014 the Bay Area Transformative Justice Collective (BATJC) began using\nthe term “pod” to refer to a specific type of relationship within transformative justice (TJ) work.\nWe needed a term to describe the kind of relationship between people who would turn to each\nother for support around violent, harmful and abusive experiences, whether as survivors,\nbystanders or people who have harmed. These would be the people in our lives that we would\ncall on to support us with things such as our immediate and on-going safety, accountability\nand transformation of behaviors, or individual and collective healing and resiliency.\n\n\nPrior to this, we had been using the term “community” when we talked about transformative\njustice, but we found that, not surprisingly, many people do not feel connected to a\n“community” and, even more so, most people did not know what “community” meant or had\nwildly different definitions and understandings of “community.” For some, “community” was an\noverarching term that encompassed huge numbers of people based on identity (e.g. “the\nfeminist community”); while for others “community,” referred to a specific set of arbitrary\nvalues, practices and/or relationships (e.g. “I don’t know them well, but we’re in community\nwith each other”); or some defined “community” simply by geographic location, regardless of\nrelationship or identity (e.g. “the Bay Area community”). We found that people romanticized\ncommunity; or though they felt connected to a community at large, they only had significant\nand trustworthy relationships with very few actual people who may or may not be part of that\ncommunity. For example, someone might feel connected to “the queer community,” but when\nasked who from that “queer community” they felt they could trust to show up for them in times\nof crisis, vulnerability or violence, they could only name 2 or 3 people.\n\n\nAlthough “community” is a word that we use all the time, many people don’t know what it is or\nfeel they have never experienced it. This became increasingly confusing as we used terms such\nas “community accountability” or “community responses to violence” and encouraged people\nto “turn to their communities;” and this became even more complicated in dealing with intimate\n\fand sexual violence because the violence, harm and abuse was often coming from their\n“community” because so many people are abused by someone they know.\n\n\nWe needed a different term to describe what we meant, and so, “pods” was suggested and it\nstuck. This is not to say that we don’t use the term “community” still—we do; but we needed to\ncreate new language for our work.\n\n\nWe knew that across the board, people who experience violence, harm and abuse turn to their\nintimate networks before they turn to external state or social services. Most people don’t call\nthe police or seek counseling or even call anonymous hotlines. If they tell anyone at all, they\nturn to a trusted friend, family member, neighbor or coworker. We wanted a way to name those\ncurrently in your life that you would rely on (or are relying on) to respond to violence, harm and\nabuse.\n\n\n\nPOD\n\nYour pod is made up of the people that you would call on if violence, harm or abuse\nhappened to you; or the people that you would call on if you wanted support in taking\naccountability for violence, harm or abuse that you’ve done; or if you witnessed violence\nor if someone you care about was being violent or being abused.\n\n\nPeople can have multiple pods. The people you call to support you when you are being harmed\nmay not be the same people you call on to support you when you have done harm, and vice\nversa. In general, pod people are often those you have relationship and trust with, though\neveryone has different criteria for their pods.\n\n\nOnce we started using the term “pods,” we realized a bunch of things:\n   ●     Most people have few solid, dependable relationships in their lives. Much of this is\n         from the breaking of relationships, isolation, fear and criminalization that capitalism\n         requires. We found that for many people, mapping their pod was a sobering process, as\n         many thought their pod would be larger than it actually was. It is not uncommon for\n\f    most people to have 1 or 2 people in their pod. We reassure people this is not a\n    popularity contest, but rather a chance to reflect on why we have so few relationships\n    with the kind of deep trust, reliability and groundedness we need to be able to respond\n    well to violence.\n●   Many people have less people they could call on to take accountability for harm\n    they’ve done than harm that happened to them. Though competent support for\n    surviving violence is few and far between, we have found that accountable support for\n    someone taking accountability for harm they have done is even harder to find. More\n    often than not, people end up colluding with abusers or reinforcing the shaming and\n    blaming of survivors in their attempt to support someone in taking accountability for\n    harm, if they stay in relationship with people who have harmed or been violent at all.\n●   Asking people to organize their pod was much more concrete than asking people\n    to organize their “community.” Once we had the shared language and concept of\n    “pod,” it allowed transformative justice to be more accessible. Gone were the fantasies\n    of a giant, magical “community response,” filled with people we only had surface\n    relationships with; and instead we challenged ourselves and others to build solid pods\n    of people through relationship and trust. In doing so, we are pushed to get specific\n    about what those relationships look like and how they are built. It places\n    relationship-building at the very center of transformative justice and community\n    accountability work.\n●   “Pod people” don’t fall neatly along traditional lines, especially in situations of\n    intimate and sexual violence. People don’t necessarily turn to their closest relationships\n    (e.g. partner, family, best friends), especially because this is often where the violence is\n    coming from, but also because the criteria we would use for our pod people is not\n    necessarily the same as what we use (or get taught to use) for our general intimate\n    relationships. We have different and specific kinds of relationships with our pod people,\n    often in addition to relationship and trust, they involve a combination of characteristics\n    such as, but not limited to: a track record of generative conflict; boundaries; being able\n    to give and receive feedback; reliability. These are characteristics and skills that we are\n    not readily taught to value in U.S. society and don’t usually have the skillset to support\n    in even our closest relationships.\n\f●   Building analysis was much easier than building the relationship and trust required\n    for one’s pod. Once people started to identify their pod, it became clear that most of\n    the people they would call on were not necessarily political organizers or activists and\n    usually didn’t have political analysis. This was true, even for political organizers and\n    activists who were mapping their pods. Using the language of “pods” was a way to\n    meet people where they were and reveal what was already working in their intimate\n    networks. People already had individuals in their lives they would turn to when violence\n    happened (even if it was just one person). So this is where we needed to focus our\n    work, instead of trying to build new relationships with strangers who might share a\n    political analysis, but had no relationship to each other, let alone trust. We set out to\n    build through our relationships and trust. We then worked to support our folks in\n    cultivating a shared analysis and framework for understanding intimate and sexual\n    violence through many things, most notably our transformative justice studies.\n●   The BATJC focuses on transformative justice responses to child sexual abuse.\n    Growing and deepening our pods helps us build where children already are.\n    Utilizing the concept of pods is a way to reach children where they are because a 5 year\n    old is not going to reach out to us for support, nor should they be expected to\n    spearhead a community accountability process. The more we can grow our own pods\n    and have conversations about protecting and supporting the children and youth in our\n    lives, the better prepared we will be to respond to child sexual abuse in our intimate\n    networks.\n●   Relationship and trust, not always political analysis, continue to be two of the\n    most important factors in successful TJ interventions, whether in supporting\n    survivor self determination and healing, or in accountability processes. Though shared\n    language, values, and political understandings can be very useful in responding to\n    violence, we find that these are easier to build where relationship and trust already exist.\n    By building where there is already authentic relationships and trust, rather than trying to\n    piece together shallow versions, we help to set the conditions for, not only, successful\n    TJ responses, but the likelihood that people will respond to violence at all.\n●   There are many people who do not have any pod people. This a very real reality for\n    many oppressed and isolated communities/individuals because of how capitalism,\n\f       oppression and violence shape our lives. For example, many disabled people are\n       extremely isolated because of lack of access and resources; many immigrant women of\n       color are isolated because of language or documentation; adults, youth and children\n       who are surviving current abuse such as domestic violence may be isolated by their\n       abusers. We hope that by beginning to build and grow pods where they already exist (or\n       could exist), we can help build the conditions to be able to support people who do not\n       have pods. By growing the number of people in the Bay Area who can recognize, talk\n       about, prevent and respond to violence, we hope to make it that much more likely that\n       people in need of support will find it in their daily lives. We also believe that orienting\n       from a place of growing pods can help us gradually move away from the structures that\n       keep people isolated. In this way, building our pods is not only useful for ourselves and\n       the people in our immediate circles, but has the potential to help build a network of\n       pods that could support anyone experiencing violence.\n\n\n\n\nBATJC POD MAPPING WORKSHEET\n\nBelow is our Pod Mapping Worksheet. We use this as a template to help people start to identify\nwho could be in their pod(s). We invite people to fill out multiple worksheets for their different\npods. This is only a basic template, people are welcome to create their own pod maps.\n   ●   Write your name in the middle grey circle.\n   ●   The surrounding bold-outlined circles are your pod. Write the names of the people who\n       are in your pod. We encourage people to write the names of actual individuals, instead\n       of things such as “my church group” or “my neighbors.”\n   ●   The dotted lines surrounding your pod are people who are “movable.” They are people\n       that could be moved in to your pod, but need a little more work. For example, you might\n       need to build more relationship or trust with them. Or maybe you’ve never had a\n       conversation with them about prisons or sexual violence.\nThe larger circles at the edge of the page are for networks, communities or groups that could\nbe resources for you. It could be your local domestic violence direct service organization, or\nyour cohort in nursing school, or your youth group, or a transformative justice group.\n\f"
