f.vermont.gov/doc/contacts/partners/aaa​​.​                             ​communication devices that​\n             ​Set up a “buddy system” or​​neighborhood pod​​where each​                         ​work without internet​\n              ​elder has a designated check-in partner.​\n               ​Coordinate with municipal emergency managers for welfare​\n                ​checks and transport plans.​\n                 ​Have first responders learn basics of American Sign​\n                  ​Language​\n                   ​Include visual aids on important informational resources​\n                    ​Consult with the Vermont Center for Independent Living​\n                     ​when creating emergency plans​\n\n ​Preparedness and Supplies​\n\n        ​ elp elders assemble emergency kits with labeled containers​ ​Essential Items for Go Bags​\n        H\n        ​and easy-open packaging.​                                            ​7-day supply of medications​\n         ​Identify medication refill and delivery systems (pharmacies,​        ​and a printed medication list.​\n          ​mutual aid networks)​                                                ​Glasses, hearing aid batteries,​\n           ​Connect with local electricians or solar installers about​           ​mobility aids (cane, walker)​\n            ​powering medical devices (oxygen, CPAPs, mobility aids).​            ​Spare phone chargers and​\n                                                                                   ​battery bank.​\n                                                                                    ​Comfort items (blanket, family​\n                                                                                     ​photos).​\n                                                                                      ​Emergency ID and medical​\n                                                                                       ​info card.​\n\n ​Shelter and Mobility Support​\n\n        I​d