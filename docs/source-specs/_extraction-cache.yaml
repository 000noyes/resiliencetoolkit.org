    text: "​2.2 Shared tools​\n​Folder with resources and templates:​      2.2 Shared tools\n\n​Tool lending library​\n        ​Identify useful, higher cost, sharable tools and equipment that could be gathered in one space or a​\n         ​people with tools who are willing to lend them.​​Create a directory​​of this information.​\n          ​If your area established a tool lending system during disaster response, consider building up a regularly​\n           ​available library for on-going use. See sections 1.3, 1.6, 1.11 for lists of tools useful for disaster​\n            ​response and recovery.​\n             ​Read up on best practices and existing ways of doing this.​\n                    ​New Suns Community Center (Thetford) and Cooperation Vermont (Marshfield) have tool​\n                     ​libraries.​\n                      ​Library of Things toolkit from Shareable​\n                       ​myTurn​​, online tool for managing tool sharing​\n                        ​Tool Library Alliance​​- lots of resources here​\n\n​ ech lending library​\nT\n​These items may already be a part of your local library, or could be housed and managed through the library.​\n ​Systems​                                                    ​Stuff​\n\n         ​ nsure people know what is available and​\n         E                                                              ​Potential items to include:​\n         ​how to access it.​                                                    ​Phones​\n          ​Consider making more items available for​                             ​laptops​\n           ​longer-term use or facilitating direct​                               ​Tablets​\n            ​trades/lends between community members​                               ​portable hotspots​\n             ​with an extra laptop and someone who lost​\n                                                                                    ​Projectors​\n              ​theirs in a house fire.​\n                                                                                     ​speakers​\n               ​Create a directory of available items​​.​\n                                                                                      ​AM/FM Radios​\n                                                                                       ​Weather Radios​\n                                                                                        ​Walkie Talkies​\n                                                                                         ​GPS (non-vehicle)​\n\n\n​Internet and phone access​\n        ​Identify areas for public or low-cost internet access when home systems are down. This is commonly​\n         ​libraries​​, town offices and schools.​\n          ​Consider reaching out to local businesses that could be made more accessible during disaster (maybe​\n           ​in the town over or a less flood-prone area).​\n            ​Consider investing in a few portable, solar back-up power units as well as power banks that can be​\n             ​stored and ready in public spaces with wifi to create hotspots if phone service is cut out but internet can​\n              ​be accessed. Use tools like the Footprint Project for resources.​\n               ​Mesh Networks​​can be established with limited required infrastructure and offer localized peer to peer​\n                ​secure communication and data sharing. Some examples:​​Fognet​​network,​​Meshtastic - Low-power​\n                 ​data sharing & communications network​​,​​DIY Cellular Signal Booster - No Electricity Required​​. More​\n                  ​Information on digital resilience​​here.​\n\n\n                                                                ​Use the toolkit online at​​resiliencetoolkit.org​    ​42​\n\f"
  4b4f5adf217d19f773155c938cc60d1aaa8ac751d09ab25885dc67124fe6ffdd:24:
