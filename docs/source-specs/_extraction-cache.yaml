    text: "​1.9 Community emergency response plans​\n​ older with resources and templates:​ 1.9 Community emergency response plans\nF\n​Before disaster​\n        ​Identify if there are already local documents outlining the emergency response plan for your town and​\n         ​town’s leaders during an emergency:​\n                                               ​Emergency Management Director (EMD): plans for/leads disaster response; develops, updates,​\n                                                ​and implements local emergency management plan (​​LEMPs​​).​\n                                                 ​Fire Department: often first line of disaster rescue, sometimes helps with recovery. May have​\n                                                  ​machinery for vehicle extraction.​\n                                                   ​First Responders/Emergency Medical Services (EMS)​\n                                                    ​Town Clerk/Administrator/Manager, Select Board Members​\n                                                     ​Town Road Crew​\n                                                      ​Mutual Aid and/or Neighbor-to-Neighbor Network leader(s)​\n          ​Create a directory​​of emergency managers, municipal leaders, heads of neighbor-to-neighbor groups,​\n           ​etc. that will be used to coordinate and communicate at the town-wide level.​ ​Places to gather​\n            ​information​​: The​​911 EMS agency​​that covers any given town should have a list of local​\n             ​first-responders.​\n                                                       ​In the event that the ambulance comes from several towns away, there may be local​\n                                                        ​first-responders, including the fire department, who are linked in with the EMS agency​\n                                                         ​responsible for covering your town more immediately.​\n              ​Share this directory with everyone listed in it, or organize an event where everyone can meet one​\n               ​another and strategize/role play around what they do when disaster strikes​\n                ​Create a clear communication system specifically for emergency response​\n                 ​Organize neighborhood pods with block captain/​​phone tree systems​​if there is phone service​\n                  ​Create a directory of neighbors​​with street addresses, landline contacts, etc.​\n                   ​Create a directory of local first responders​​, paid and volunteer​\n                    ​Identify people trained in HAM radio​\n                     ​Identify an evacuation plan and options for sheltering nearby if evacuation is not possible.​\n                      ​Create a plan for volunteers to physically sweep known problem areas - EMS does not monitor these!​\n                       ​Identify a core team of people to do pre-outreach by town or volunteer/supply hub to share​​information​\n                        ​about preparedness​​, and distribute info on available resources and where to direct needs.​\n                         ​If there is none, establish a neighbor-to-neighbor or mutual aid group in your town. Consider partnering​\n                          ​with an existing group that already holds a lot of relationships. EMS and some municipalities often have​\n                           ​lists of vulnerable people. Make sure those folk are known to the neighbor-to-neighbor group.​\n                            ​Identify language access needs and utilize tools like the​​GoogleTranslate​​to support communication​\n                             ​during emergencies. The​​VT Language Justice Project app​​can also be used to share informational​\n                              ​videos in individuals’ language. See​​Section 1.8​​for info on populations with specific needs.​\n ​During disaster​\n                               ​Hold daily meetings w/ key stakeholders (Mutual Aid Orgs, EMS, EMD, selectboard, etc) and create​\n                                ​situation reports​​about actions taken during emergency response​\n                                 ​Hold regular public assemblies at an accessible time/place; share easy to absorb information; distribute​\n                                  ​other things people need (food, water, fuel). Advertise assemblies with posters and by word of mouth. If​\n                                   ​you have access to the internet and phone service, utilize phone trees, Front Porch Forum, social​\n                                    ​media, and local listservs/messaging threads.​\n                                     ​Create hand-outs/digital surveys to capture requests from impacted residents, which integrate into a​\n                                      ​tracker for case management​\n\n                                                                            ​Use the toolkit online at​​resiliencetoolkit.org​              ​32​\n\f          ​ se weather maps at​​waterdata.usgs.gov/vt/nwis/rt​​and the​​River Aware​​app,​​Identify people to look​\n          U\n          ​at the river and watch for ice and debris dams.​\n           ​Receive/submit alerts at​​vem.vermont.gov/vtalert​​and TextMyGov.​\n​Planning for other kinds of climate disaster​\n ​While flooding is VT’s most common climate disaster, consider other potential events in emergency plans:​\n            ​Wildfire smoke​​: prolonged exposure to wildfire smoke can cause respiratory issues and other health​\n             ​problems.​\n                          ​Monitor air quality levels via​​AirNow.gov​\n                           ​Store N95s/KN95s/respirators along with other emergency supplies to protect people from​\n                            ​dangerous air quality (​​1.3​​)​\n                             ​Identify public spaces with air filtration if you do not have air filtration at home like libraries,​\n                              ​schools, health centers (similar to warming and cooling shelters,​​1.5​​).​\n              ​Wet bulb temperatures & High Heat Index​​:​​a hazardous combination of high heat and high humidity.​\n               ​Above around 86ºF plus high humidity can create wet bulb conditions.​\n                               ​Communicate across community networks and public information channels when heat​\n                                ​advisories are in effect (​​1.9​​)​\n                                 ​Remind people about the importance of hydration; create access to drinking water in public​\n                                  ​places on hot days by putting out water coolers and signage (​​1.2​​)​\n                                   ​Especially during the hottest part of the day (11am - 3pm), stay in the shade or in other cool​\n                                    ​locations, including cooling shelters (​​1.5​​).​\n                                     ​Learn the signs of, and communicate about, heat exhaustion (headache, fever, dizziness,​\n                                      ​fainting, shallow breathing, increased thirst, muscle aches, and nausea).​\n                ​Drought​​:​​Unlike other weather-related disasters, drought often comes on slowly in our region.​\n                                       ​Monitor fire danger to protect people, buildings, and ecosystems from preventable fire damage​\n                                        ​during drought conditions:​​fpr.vermont.gov/forest/wildland-fire/monitoring-fire-danger​\n                                         ​Cut back on watering lawns and non-food plants; turn off taps; reduce toilet flushing.​\n                 ​Ice & Wind storms​​can take out power lines, and in turn, heat and cooling.​\n                                          ​At home, store emergency food that does not need electricity to prepare and water on hand​\n                                           ​(​1.2​​), and back-up power/heating (​​1.4​​)​\n                                            ​If staying home is not safe, leave home before travel conditions worsen. Identify local warming​\n                                             ​and cooling shelters (​​1.5​​) ahead of the storm​\n                                              ​Consider back-up communications (radios, walkies, default meetup plans) as electricity, wifi and​\n                                               ​phones may go down (​​1.9​​;​​2.2​​)​\n                  ​Public health emergencies and​​pandemics​\n                                                ​Emergent public health threats can be difficult to plan for, but keeping people healthy can​\n                                                 ​protect communities from the worst impacts of pandemics and other health emergencies. See​\n                                                  ​Section 2.1​​of the toolkit for information on meeting basic needs, including health needs.​\n                                                   ​Creating community emergency response plans (​​1.9​​) beforehand, plans to support populations​\n                                                    ​with specific needs (​​1.8​​), and setting up mutual aid networks (​​1.12​​) can increase community​\n                                                     ​resilience amid public health crises.​\n                                                      ​Stay updated with new information coming from local, state, or federal government sources, as​\n                                                       ​well as public health officials and experts in your community. Hold community gatherings (​​2.3​​) to​\n                                                        ​share information.​\n  ​Also consider planning for disasters that include increased military presence or heightened risk of violence.​\n\n\n\n\n                                                                                   ​Use the toolkit online at​​resiliencetoolkit.org​                    ​33​\n\fNeighbor directory for:\nNAME                      PHONE   EMAIL   ADDRESS\n\fEmergency/First Responder Directory                Town name:\n\nEmergency Service Name/Person     Function/Skill   Town/Area of coverage   Contact   Notes\n\fDirectory of local leaders for emergency management coordination in ____________________________________\nLink to local emergency plan:\nTITLE/ROLE                                  NAME                          PHONE                            EMAIL\nState Senator(s)\nState Representative(s)\nRegional planning commission staff\nLong Term Recovery Group\nFire chief\nRoad crew\nEmergency Management Director\nTown clerk\nSelectboard members\nMutual aid/neighbor-to-neighbor leader(s)\nFlood Survivor(s)\nCommunity point people\nSchool principal\nGeneral store owner\n\f"
