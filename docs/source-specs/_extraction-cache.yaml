    text: "Your pod(s) may shift over time, as your needs or relationships shift or as people’s geographic\nlocation shift. We encourage people to have conversations with their pod people about pods\nand transformative justice, as well as to actively grow the number of people in their pod and\nsupport each other in doing so. Growing one’s pod is not easy and may take time. In pod work,\nwe measure our successes by the quality of our relationships with one another and we invest in\nthe time it takes to build things like trust, respect, vulnerability, accountability, care and love.\nWe see building our pods as a concrete way to prepare and build resources for transformative\njustice in our communities.\n\n\n\n\nThis work is licensed under a Creative Commons Attribution 4.0 International License\n\f"
