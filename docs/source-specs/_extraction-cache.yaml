    text: "​1.8 Populations with specific needs​\n​ older with resources and templates​ 1.8 Populations with specific needs\nF\n​Children, childcare, and youth engagement with disaster​\n ​Consider engaging older youth in recovery work—which can build a sense of belonging and connectedness​\n  ​with community in what can be an isolating time. See Section 1.10 on Volunteer Management for more.​\n ​Systems​                                                     ​Stuff​\n\n ​Communication and planning​\n\n        ​ ake a plan of where to go/who to call if​\n        M                                                      ​Essential Items for Go Bags​\n        ​separated: who will we contact? where will​                   ​Contact/emergency phone numbers,​\n         ​we meet?​                                                     ​including emergency contact info for​\n          ​Once old enough, have your child memorize​                    ​non-primary caregivers (e.g., uncle,​\n           ​their caregiver’s phone number​                               ​grandparent) in case of separation​\n            ​Create a backpack/go bag that is easy to​                     ​Snacks and water​\n             ​travel with for the age/size of the kid​                      ​Infants - formula and diapers​\n              ​Have conversations about different kinds of​                  ​Comfort item - stuffed animal, etc.​\n               ​disasters and what to do in case of​                          ​Entertainment - game, drawing paper/pens​\n                ​emergency (e.g., wildfire, flood,​                            ​Two changes of clothes​\n                 ​communications blackout, etc.)​                               ​Medications​\n                                                                                 ​List of child allergies, if applicable​\n\n ​Community Care and Well-Being​\n\n        ​ ocate or create a directory of local childcare​\n        L                                 