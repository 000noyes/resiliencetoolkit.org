    text: "​1.2 Food and water​\n​Folder with resources and templates:​             1.2 Food and water\n ​Systems​                                                      ​Stuff​\n\n ​Backup food supply​\n\n           ​ reate household and​​community​\n           C                                              ​Backup foods to store:​\n           ​backup stores​​of food.​                            ​Ready-to-eat canned meats, fruits, vegetables​\n            ​Rotate stock, perhaps in collaboration​             ​and a can opener​\n             ​with a store or food shelf.​                        ​Protein/fruit bars​\n              ​Use critter and humidity safe containers.​\n                                                                   ​Dry cereal/granola​\n ​Consider sourcing and storing food that can be​                   ​Peanut butter​\n  ​prepared and distributed at community scale,​                     ​Dried fruit​\n   ​especially in the 1-2 days during / after disaster.​              ​Canned juices​\n                                                                       ​Non-perishable pasteurized milk​\n                                                                        ​High-energy foods​\n                                                                         ​Food for infants​\n                                                                          ​Comfort/stress foods​\n\n ​Community food infrastructure​\n\n I​dentify​​community-scale equipment and​                                ​ alk in cooler or freezer space​\n                                                                          W\n  ​infrastructure​​for food security.​                                    ​Root cellar​\n                                                                           ​Storage or warehouse space for non-perishables​\n                                                                            ​and related supplies​\n                                                                             ​Kitchen/cooking supplies (large pots, spoons,​\n                                                                              ​ladles, knives, cutting boards, etc)​\n                                                                               ​Group meal kit (plates, silverware, napkins, hand​\n                                                                                ​sanitizer or hand washing station)​\n\n ​Water supply and storage​\n\n I​f your municipality’s central water system is​                         ​Water storage vessels​\n  ​down, plan for how to source large volumes of​                                    ​IBC totes (275 gallons)​\n   ​water via wells or water trucks, and distribute​                                  ​5 gallon buckets​\n    ​via water stations in the community.​\n                                                                                       ​1 gallon jugs​\n            ​Identify local clean and potable water​\n                                                                           ​Spigots and pumps (gas powered, AC powered,​\n             ​sources​\n                                                                            ​DC powered, hand powered)​\n              ​Store 2-5 days of water​\n                                                                             ​Water filtration system (bleach, iodine, etc)​\n               ​Rotate water stock every 6-12 months​\n                ​and store out of the heat and extreme​\n                 ​cold.​\n                  ​Back-up method to fill up water jugs.​\n                   ​Test your water; test kits are available​\n                    ​thru VT Department of Health.​\n\n ​Community meals​\n\n\n                                                                          ​Use the toolkit online at​​resiliencetoolkit.org​     ​20​\n\f​ rovide meals for communities during disaster​\nP                                                                                      ​Kitchen and meal distribution​​supplies​\n​and recovery. Feeding people is key to​                                                        ​Walk-in cooler/refrigeration system​\n ​sustaining response and relief efforts.​\n                                                                                                 ​Chest freezer​\n         ​If there are existing providers of​\n                                                                                                  ​Oven range, oven mitts​\n          ​community meals, ask them to cook​\n           ​large meals for distribution​                                                          ​Food processor/blender​\n            ​Conduct outreach to ask for meals from​                                                ​Access to of potable water​\n             ​nearby restaurants, organizations and​                                                 ​First aid kit​\n              ​community meals in neighboring towns.​                                   K\n                                                                                        ​  itchen                                  supplies​\n               ​Create a directory​​of, or​​set up kitchens​                                          ​8 - 10 qt stock pots​\n                ​in your community available for creating​                                             ​10-12 inch frying pans​\n                 ​both community meals and possibly​                                                    ​Graters​\n                  ​meal trains for individual household use.​                                            ​Salad spinners​\n                   ​Local churches or restaurants might be​                                               ​Colander/sieves​\n                    ​able to offer access to a commercial​\n                                                                                                           ​Cutting boards​\n                     ​kitchen, reusable plates and silverware,​\n                                                                                                            ​Sharp knives of multiple dimensions​\n                      ​etc.​\n                                                                                                             ​Tea kettle, drip coffee maker​\n                       ​Create a directory of cooks​​who are​\n                                                                                                              ​Peelers, knives, spatulas, tongs, slotted spoons,​\n                        ​prepared to meal share (cook extra) for​\n                                                                                                               ​thermometer, can openers, whisks, funnels​\n                         ​households who have lost access to​\n                          ​kitchens, food, water, etc​                                                          ​Measuring cups and spoons, muffin tins, rolling​\n                                                                                                                 ​pins, casserole dishes, roasting pans​\n                           ​Establish a system to distribute food at​\n                            ​volunteer coordination and supply pickup​                                            ​Serving platters, bowls, plates and utensils​\n                             ​sites​                                                                               ​Mixing bowls​\n                              ​Set a daily and weekly schedule for​                                                 ​Baking sheets, loaf pans​\n                               ​meals, and get volunteers to sign-up for​                                            ​Large food-grade containers for storing and​\n                                ​making or distributing meals​                                                        ​transporting​\n                                 ​Source food to fill in distribution dates​                                           ​Containers to bring meals home​\n                                  ​and times​                                           ​Cleaning supplies​\n                                   ​Ensure safe food handling​​at distribution​                                         ​hand and dish soap​\n                                    ​centers - refrigeration/coolers for things​                                         ​Bleach​\n                                     ​to stay cold vs. crock pots and portable​                                           ​garbage bags​\n                                      ​stoves to keep things warm.​                                                        ​pot scrubbers​\n                                       ​Create a directory of food access points​​,​                                        ​rubber gloves​\n                                        ​using a spreadsheet,​​google map​​, or​\n                                                                                                                             ​dish cloths​\n                                         ​other format​​. Include resources like food​\n                                                                                                                              ​towels​\n                                          ​shelves, free food distributions and meal​\n                                                                                         ​Food serving supplies​\n                                           ​sites, general and grocery stores,​\n                                                                                                                               ​Plates & Bowls​\n                                            ​farmers’ markets.​\n                                                                                                                                ​Utensils (forks, knives)​\n                                                                                                                                 ​Cups​\n\n\n\n\n                                                                                       ​Use the toolkit online at​​resiliencetoolkit.org​                            ​21​\n\f"
