d community​                               ​or on the weekends​\n                 ​member, visit trusted community spaces to​                                 ​Arrange transportation​\n\n\n                                                                     ​Use the toolkit online at​​resiliencetoolkit.org​              ​28​\n\f       ​ hare information, or explore the option of​\n       s                                                              ​ ranslate and share the emergency list of​\n                                                                      T\n       ​home visits to share information with trusted​                ​to-go items with individuals​\n        ​community members​                                            ​Create a written list of contacts people can​\n                                                                        ​reach out to​\n\n​During Disaster​\n\n       I​f you are convening people during an​                        ​ osters, markers​\n                                                                      P\n        ​emergency, post signage in applicable​                       ​Have laminated cards prepared for quick​\n         ​languages​                                                   ​translation needs​\n          ​Develop local transport plans with volunteers​               ​Will you be using a LanguageLine? Have​\n                                                                         ​assistance from a bilingual community​\n           ​Train volunteers on the​​procedure​​for​                      ​member?​​Google Translate​ ​is a great app to​\n            ​interacting with LEP individuals, from start to​              ​download if neither is available. You can plan​\n             ​finish​                                                       ​ahead by downloading a language too.​\n              ​Access to services​                                                      ​Try not to have children interpret!​\n          