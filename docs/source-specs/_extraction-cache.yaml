    text: "​1.11 Flood recovery supplies and work​\n​ older with resources and templates:​ 1.11 Flood recovery supplies and work\nF\n​This section is focused on flood recovery for homes and other buildings, but can be useful for other disasters.​\n ​These instructions were compiled by NEK Organizing, which has mucked and gutted hundreds of homes in the​\n  ​Kingdom.​\n   ​Managing flood site and survivor information​\n          ​Vermont will tell people to call 211 to report flood damage. While this is helpful and important to have​\n           ​state data, relief organizations then have to comb through all 211 calls to find flood survivor data. This​\n            ​can be incredibly time consuming, and is a good place for volunteers that cannot do physical labor.​\n             ​Create a​​flood survivor/site sheet or tracking system​​that includes information about the site, the​\n              ​contact information for the survivors, and any other important information going forward into the​\n               ​recovery phase (damage to water, sewer, foundation, etc).​\n    ​Managing flood recovery supplies​\n                ​Store supplies—for relief, response, recovery—in a place that is dry, flood safe, and accessible by​\n                 ​many people. If possible, utilize a lock with a code if possible and have more than one location per​\n                  ​town.​\n                   ​A cache of pumps, safety equipment, and demolition tools stocked and pre-packed so they’re ready for​\n                    ​the four types of work that immediately follow flooding: pumping, mucking, gutting, and mold​\n                     ​remediation.​\n ​Systems​                                 ​Stuff​\n\n ​ umping​\n P\n ​Pumping​​is the process of removing water from the home via sump, trash, and transfer pumps.​\n\n I​f there is a sheen to the water,​       ​ rder water testing kits from the Department of Health at​\n                                           O\n  ​note that oil and/or petroleum may​     ​healthvermont.gov/lab/forms​\n   ​be present. Contact your state’s​\n    ​Department of Environmental​          ​ ump Pump Kit:​​Sump pumps are good for removing​​clean​​water and​\n                                           S\n     ​Conservation before pumping to​      ​are often the first tool to grab post-flood.​\n      ​prevent further, more costly​                ​Sump Pump​\n       ​damage to the home.​                         ​Garden Hose(s)​\n                                                      ​Extension cord(s)​\n ​ OTE: Be aware that pumping a​\n N\n ​basement before water outside​           ​Other helpful pumps to have on hand​\n  ​has receded may compromise the​\n                                                   ​Trash Pump (with hose, filter, and extension) for water mixed​\n   ​foundation due to pressure from​\n                                                    ​with debris​\n    ​outside.​\n                                                     ​Transfer Pump (with hoses and extension cords) for the last few​\n                                                      ​inches of water on the floor​\n\n ​Mucking​\n ​ ucking​​is the process of shoveling, raking, squeegeeing, and hauling mud, silt, and wet belongings out of​\n M\n ​the home.​\n\n ​Notes for team leaders​                  ​ ork Tote:​​20-gallon, heavy duty plastic tote filled with safety​\n                                           W\n     ​●​ ​Collect and share​               ​equipment for 5 people mucking and/or gutting a home. Work totes go​\n          ​information on hazardous​        ​out on every job, with every crew, no matter what.​\n           ​conditions - trash, sharps,​\n\n\n                                                                ​Use the toolkit online at​​resiliencetoolkit.org​   ​36​\n\f         ​ as leaks, sewage​\n         g                                                    ​ ork Tote pack list​\n                                                              W\n         ​contamination, etc with​                                   ​Contractor bags - 1-2 rolls​\n          ​volunteers​                                                ​Goggles - 5​\n   ​●​     ​Establish location for​                                    ​Tyvek suits - 5-10​\n            ​hazardous materials to be​\n                                                                        ​P100 respirators (plastic w cartridges) - 5​\n             ​gathered​\n                                                                         ​N95 masks - 10​\n   ​●​        ​Identify handwashing​\n               ​station​                                                  ​Nitrile/hospital gloves - 1 box/bag of S, M + L​\n   ​●​          ​Demonstrate using proper​                                 ​Rubber grip work gloves​                           ​- 5-10​\n                 ​PPE. And, be prepared for​                                ​Hand sanitizer & Sani wipes- 1​\n                  ​a dynamic in which​                                       ​Paper towels - 1​\n                   ​volunteers are using PPE​                                 ​First Aid Kit - 1​\n                    ​and residents are not;​                                   ​Sunscreen - 1​\n                     ​volunteers get to leave and​                              ​Bug Spray - 1​\n                      ​residents have to remain. It​\n                                                                                 ​Narcan - 4+​\n                       ​can be helpful to make​\n                                                                                  ​Earplugs - 10+​\n                        ​volunteers aware of this​\n                         ​dynamic before heading to​                               ​Duct tape - 1​\n                          ​the home you’re mucking.​ ​Other Muck Tools (not stored in tote)​\n   ​●​                     ​Remind volunteers to use​                               ​ ead Lamps​\n                                                                                    H\n                            ​proper ergonomics and​                                 ​Waterproof/Muck Boots​\n                             ​take breaks to rest and​                               ​Flathead Shovel​\n                              ​hydrate.​                                              ​Spade Shovel​\n   ​●​                         ​If possible, have a nurse​                             ​Giant Floor Squeegees​\n                                ​onsite or at your volunteer​                           ​Steel Garden Rakes​\n                                 ​headquarters to offer​\n                                                                                         ​Power Washer​\n                                  ​tetanus shots!​\n                                                                                          ​Tarps (to slide debris around and also to protect the floor–​\n                                                                                           ​especially if there isn’t a bulkhead and muck and debris needs​\n                                                                                            ​to come up the stairs inside the home)​\n                                                                                             ​Jet Sled​\n                                                                                              ​Garden Cart/Wheelbarrow​\n                                                                                               ​5-gallon Buckets​\n                                                                                                ​Generator​\n                                                                                                 ​Extension Cords​\n                                                                                                  ​Work Lights on Pedestals and/or Clips​\n\n​ utting​\nG\n​House Gutting​​is the process of removing sheetrock, insulation and water-logged permeable materials in​\n ​order to expose joists, studs, subfloor, etc. Gutting allows a home to dry out.​\n\n​ OU CANNOT DRY A HOME​\nY                                        ​ ut Kit:​​5-gallon bucket filled with demolition equipment for a 5-person​\n                                         G\n​USING DEHUMIDIFIERS ALONE.​ ​crew, useful when mucking is done and there is no longer water​\n ​Even though gutting is another​        ​inundating the space.​\n  ​painful step amidst profound loss,​\n   ​it is absolutely necessary in order​\n    ​to prevent mold.​\n\n\n\n\n                                                                                  ​Use the toolkit online at​​resiliencetoolkit.org​                      ​37​\n\f​Notes for team leaders​                             ​ ut Kit pack list​​(for gutting flooded buildings in addition to the Work​\n                                                     G\n    ​●​ ​Collect and share​                          ​Tote)​\n            ​information on hazardous​                       ​Flat crowbars, roughly 15” - 5+ (flat prying tool with beveled​\n             ​conditions - trash, sharps,​                    ​ends for removing sheetrock, flooring, trim, and wall panels)​\n              ​gas leaks, sewage​                              ​Boxcutters/utility knives - 5+​\n               ​contamination, etc with​                        ​Extra blades - 5+​\n                ​volunteers​\n                                                                 ​Hammers - 5+​\n     ​●​ ​Identify handwashing​\n                                                                  ​Cat's paw - 1 (small prying tool used for pulling stubborn nails​\n                 ​station​\n                                                                   ​better than a hammer)​\n      ​●​ ​Demonstrate using proper​\n                  ​PPE​                                             ​Chalk Line - 1-2​\n       ​●​ ​remind volunteers to use​                                ​Bit box - 1​\n                   ​proper ergonomics and​                            ​Screwdrivers - 1-2​\n                    ​take breaks to rest and​                          ​Earplugs - 10+​\n                     ​hydrate​                                          ​Tape measure - 1+​\n                                                                         ​Sharpie - 1+​\n                                                      ​Other Gut Tools (not stored in tote)​\n                                                                          ​Sawzall/Reciprocating Saw​\n                                                                           ​Impact driver​\n                                                                            ​Head Lamp​\n                                                                             ​Dehumidifier​\n                                                                              ​Fans​\n                                                                               ​Extension Cords​\n\n​Mold remediation​\n​Mold remediation​​happens once wet debris, walls, flooring, and insulation are removed.​\n\n         I​ntroduce light and air to​                ​Mold Remediation Tools​\n          ​the space via​                                   ​Moisture reader​\n           ​dehumidifiers, fans, and​                        ​Agriculture sprayer and/or industrial spray bottles​\n            ​open doors and windows.​                         ​Shockwave, white vinegar, or EPA-certified fungicide (not​\n             ​Apply either a vinegar​                          ​bleach)​\n              ​solution or mold-killing​                        ​HEPA-filtered vacuum​\n               ​fungicides (not bleach)​                         ​Wire brushes​\n                ​once moisture levels are​\n                                                                  ​Deck brushes or other stiff brushes with long handles​\n                 ​below 17 percent in studs​\n                                                                   ​Full PPE: P100 respirators, goggles, rubber gloves, tyvek suits​\n                  ​and joists. While some​\n                   ​fungicides can be applied​                      ​Scrapers, pallet knives, blades​\n                    ​in wetter environments, it’s​\n                     ​best to apply chemicals to​\n                      ​very dry surfaces for the​\n                       ​best outcomes.​\n\n\n\n\n                                                                            ​Use the toolkit online at​​resiliencetoolkit.org​         ​38​\n\f‭ ump Pump Kit:‬ ‭Sump pumps are good for removing‬‭clean‬‭water and are often the first tool to grab‬\nS\n‭post-flood.‬\n        ‭Sump Pump‬\n        ‭Garden Hose(s)‬\n        ‭Extension cord(s)‬\n\n‭Other helpful pumps to have on hand‬\n        ‭Trash Pump (with hose, filter, and extension) for water mixed with debris‬\n        ‭Transfer Pump (with hoses and extension cords) for the last few inches of water on the floor‬\n\n‭ ork Tote:‬‭20-gallon, heavy duty plastic tote filled‬‭with safety equipment for 5 people mucking and/or‬\nW\n‭gutting a home. Work totes go out on every job, with every crew, no matter what.‬\n\n‭Work Tote pack list‬\n        ‭Contractor bags - 1-2 rolls‬\n        ‭Goggles - 5‬\n        ‭Tyvek suits - 5-10‬\n        ‭P100 respirators (plastic w cartridges) - 5‬\n        ‭N95 masks - 10‬\n        ‭Nitrile/hospital gloves - 1 box/bag of S, M + L‬\n        ‭Rubber grip work gloves‬‭- 5-10‬\n        ‭Hand sanitizer - 1‬\n        ‭Sani wipes - 1‬\n        ‭Paper towels - 1‬\n        ‭First Aid Kit - 1‬\n        ‭Sunscreen - 1‬\n        ‭Bug Spray - 1‬\n        ‭Narcan‬‭4+‬\n        ‭Earplugs 10+‬\n\n‭Other Muck Tools (not stored in tote)‬\n        ‭Head Lamps‬\n        ‭Waterproof/Muck Boots‬\n        ‭Flathead Shovel‬\n        ‭Spade Shovel‬\n        ‭Giant Floor Squeegees‬\n        ‭Steel Garden Rakes‬\n        ‭Power Washer‬\n        ‭ arps (to slide debris around and also to protect the floor– especially if there isn’t a bulkhead and‬\n        T\n        ‭muck and debris needs to come up the stairs inside the home)‬\n        ‭Jet Sled‬\n        ‭Garden Cart/Wheelbarrow‬\n        ‭5-gallon Buckets‬\n        ‭Generator‬\n\f        ‭Extension Cords‬\n        ‭Work Lights on Pedestals and/or Clips‬\n\n‭ ut Kit:‬‭5-gallon bucket filled with demolition equipment‬‭for a 5-person crew, useful when mucking is‬\nG\n‭done and there is no longer water inundating the space.‬\n\n‭Gut Kit pack list‬‭(for gutting flooded buildings in‬‭addition to the Work Tote)‬\n        ‭ lat crowbars, roughly 15” - 5+ (flat prying tool with beveled ends for removing sheetrock,‬\n        F\n        ‭flooring, trim, and wall panels)‬\n        ‭Boxcutters/utility knives - 5+‬\n        ‭Extra blades - 5+‬\n        ‭Hammers - 5+‬\n        ‭Cat's paw - 1 (small prying tool used for pulling stubborn nails better than a hammer)‬\n        ‭Chalk Line - 1-2‬\n        ‭Bit box - 1‬\n        ‭Screwdrivers - 1-2‬\n        ‭Earplugs - 10+‬\n        ‭Tape measure - 1+‬\n        ‭Sharpie - 1+‬\n\n‭Other Gut Tools (not stored in tote)‬\n        ‭Sawzall/Reciprocating Saw‬\n        ‭Impact driver‬\n        ‭Head Lamp‬\n        ‭Dehumidifier‬\n        ‭Fans‬\n        ‭Extension Cords‬\n\n‭Mold Remediation Tools‬\n        ‭Moisture reader‬\n        ‭Agriculture sprayer and/or industrial spray bottles‬\n        ‭Shockwave, white vinegar, or EPA-certified fungicide (not bleach)‬\n        ‭HEPA-filtered vacuum‬\n        ‭Wire brushes‬\n        ‭Deck brushes or other stiff brushes with long handles‬\n        ‭Full PPE: P100 respirators, goggles, rubber gloves, tyvek suits‬\n        ‭Scrapers, pallet knives, blades‬\n\f"
