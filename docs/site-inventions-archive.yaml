      date_removed: '2026-05-05'
      removed_in_commit: 'fix(introduction): drop print-medium "next page" directive (PR #21 follow-up)'
      rationale: |
        Workbook sentence dropped because the print-medium directive
        ("next page") doesn't apply in single-scroll digital view; the
        graphic's adjacency replaces the pointer. The FEMA Disaster
        Recovery Continuum graphic renders as a <figure> directly below
        this paragraph — the visual adjacency makes the pointer
        sentence redundant and confusing on the web.

        Pattern: "print_medium_drops" — workbook prose that references
        print-layout adjacency ("next page", "see above", "overleaf",
        "on the previous page") which the web's single-scroll layout
        already provides without the explicit pointer. When the 0-0
        introduction source spec is written, document this as an allowed
        adaptation pattern; expect similar drops elsewhere in the
        workbook prose where page-relative directives appear.

