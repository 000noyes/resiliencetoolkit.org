  # Workbook prose dropped because the print-medium directive doesn't
  # translate to digital (e.g. "See next page", "See above", "overleaf").
  # Pattern: when the workbook references print-layout adjacency that the
  # web layout already provides via single-scroll positioning, the directive
  # sentence is dropped and the visual adjacency replaces the pointer.
  print_medium_drops:
    - id: archive-0-0-phases-of-disaster-next-page-pointer
      module: 0-0
