# Toolkit Inventory — resiliencetoolkit.org
#
# Generated during Step 1a Days 2–4 Inventory Walk (started 2026-04-21).
# Classifies every user-facing content piece across the 17 module pages
# against the canonical workbook (public/toolkit/2025 Resilience Hub
# Toolkit w Templates_V1 final.pdf, 97pp, 258 hrefs, 41 Drive IDs).
#
# Classification taxonomy:
#   a  = workbook-cited (wireable in Step 1)
#   b  = template-cited (rt-templates/ — scrapped on Day 7; any (b) must
#        re-anchor to the workbook page range on promotion)
#   c  = no source / site-invented (HARD FLAG — SCOPE.md class-(c) firewall:
#        must be deleted or promoted via reviewed spec)
#
# Innovation flags per module: prose-content-could-be-interactive,
# structural-fidelity risks, and missing UI affordances the workbook implies.
# Each flag records its per-module decision (accepted/deferred/rejected + scope).
#
# Source-of-truth memory: project_rt_source_truth_pdfs.md
# Plan artifact: vscode-feat-step1a-priority-ep-eng-review-test-plan-20260421.md §2a

