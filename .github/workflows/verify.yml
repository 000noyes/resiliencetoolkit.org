name: verify-against-source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, workshop]

jobs:
  verify:
    name: verify-against-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm vitest run

      - name: Run astro check
        run: pnpm astro check

      # Gate on unused FILES only (orphan re-accumulation is the root cause we
      # are fixing). Unused exports/types are intentionally NOT gated yet — the
      # source-fidelity verifier exposes a deliberate internal API knip flags. See
      # docs/removed-code.md for the scope decision; revisit to widen later.
      - name: Check for orphaned files (knip)
        run: pnpm knip:files

      - name: Run verify-against-source
        run: pnpm verify --since HEAD~1

  offline-and-privacy:
    name: offline-and-privacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WebKit runs the same offline suite because the field failure mode is
      # iOS Safari and the home screen app, which Chromium does not model.
      # The hosts entry backs up rt.localhost resolution for WebKit, which
      # uses the system resolver (Chromium resolves *.localhost internally).
      - name: Install Playwright browsers
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          grep -q rt.localhost /etc/hosts || echo "127.0.0.1 rt.localhost" | sudo tee -a /etc/hosts

      # The offline project builds dist/ and serves it via astro preview itself
      # (see playwright.offline.config.ts webServer), then runs the real-browser
      # offline-durability + network-purity tests against the built service
      # worker. Kept a separate job so it does not slow the verify job above.
      - name: Run offline + network-purity tests
        run: pnpm exec playwright test --config playwright.offline.config.ts
